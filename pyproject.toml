[project]
name = "trading-analytics"
version = "0.1.0"
description = "End-to-end futures trade analytics pipeline: ingest, model in SQL, dashboard."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
