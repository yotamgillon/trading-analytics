[project]
name = "trading-analytics"
version = "0.1.0"
description = "End-to-end futures trade analytics pipeline: ingest, model in SQL, dashboard."
requires-python = ">=3.12,<3.13"
# Runtime of the dashboard: lean on purpose. No dbt, no Yahoo client (the deployed demo reads a
# prebuilt DuckDB file), so Streamlit Community Cloud installs only this.
dependencies = [
    "duckdb>=1.5.6",
    "jinja2>=3.1",
    "numpy>=2.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.59.1",
]

[project.optional-dependencies]
# Building the warehouse: dbt models/tests and the Yahoo bar fetcher.
pipeline = [
    "dbt-duckdb>=1.11.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "vl-convert-python>=1.9.0.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# the app puts src/ on sys.path before importing the package (Streamlit Cloud, see app.py)
"src/trading_analytics/dashboard/app.py" = ["E402", "I001"]
